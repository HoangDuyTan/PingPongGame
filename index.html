<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ping Pong Game</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
<main class="main-menu">
    <header class="game-header">
        <h1 class="game-label">Ping Pong</h1>
    </header>

    <section class="level-selection">
        <div class="section-header">
            <h2>Chòn màn chơi</h2>
        </div>

        <div class="level-grid">
            <a class="level-button" href="game.html?level=1">
                Level 1
            </a>

            <a class="level-button" href="game.html?level=2">
                Level 2
            </a>

            <a class="level-button" href="game.html?level=3">
                Level 3
            </a>

            <a class="level-button" href="game.html?level=4">
                Level 4
            </a>

            <a class="level-button" href="game.html?level=5">
                Level 5
            </a>

            <a class="level-button" href="game.html?level=6">
                Level 6
            </a>

            <a class="level-button" href="game.html?level=7">
                Level 7
            </a>

            <a class="level-button" href="game.html?level=8">
                Level 8
            </a>

            <a class="level-button" href="game.html?level=9">
                Level 9
            </a>

            <a class="level-button boss-level" href="game.html?level=10">
                Level 10
            </a>
        </div>
    </section>

    <section class="instructions">
        <h2>Cách chơi</h2>
        <p>
            - Sử dụng các phím mũi tên 'trái' và 'phải' để di chuyển thanh chắn.<br>
            - Bấm 'Space' để tạm dừng.<br>
            - Giữ cho bóng tiếp tục di chuyển và hoàn thành mục tiêu của từng màn chơi.
        </p>
    </section>
</main>
</body>
</html>
